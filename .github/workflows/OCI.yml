name: Create OCI with Terraform
on:
    workflow_dispatch:

jobs:
    OCI_IaC_Deployment:
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
        defaults:
            run:
                shell: bash
                working-directory: oracle
        
        steps:
            - name: 'Checkout'
              uses: actions/checkout@v6

            - name: 'Set Terraform env vars'
              run: |
                echo "TF_VAR_tenancy_ocid=${{secrets.OCI_TENANCY_OCID}}" >> $GITHUB_ENV
                echo "TF_VAR_user_ocid=${{secrets.OCI_USER_OCID}}" >> $GITHUB_ENV
                echo "TF_VAR_fingerprint=${{secrets.OCI_FINGERPRINT}}" >> $GITHUB_ENV
                echo "TF_VAR_region=${{secrets.OCI_REGION}}" >> $GITHUB_ENV
                echo "TF_VAR_compartment_id=${{secrets.OCI_COMPARTMENT_ID}}" >> $GITHUB_ENV
                printf 'TF_VAR_private_key<<EOF\n%s\nEOF\n' "${{secrets.OCI_KEY_FILE}}" >> $GITHUB_ENV
              working-directory: oracle

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              id: init
              run: terraform init
                
            - name: Terraform Validate
              id: validate
              run: terraform validate
        
            - name: Terraform Plan
              id: plan
              run: terraform plan
              continue-on-error: true
        
            - name: Terraform Plan Status
              if: steps.plan.outcome == 'failure'
              run: exit 1

            - name: Terraform Apply
              run: terraform apply -auto-approve